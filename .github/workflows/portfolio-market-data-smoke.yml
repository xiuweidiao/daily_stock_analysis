name: Portfolio Market Data Smoke

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/requirements-portfolio-pipeline.txt'
      - '.github/workflows/portfolio-market-data*.yml'
      - '.github/workflows/portfolio-close-watchdog.yml'
      - '.github/workflows/portfolio-snapshot-repair.yml'
      - 'cloudflare/portfolio-scheduler/**'
      - 'scripts/portfolio_*.py'
      - 'data_provider/**'
      - 'src/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cloudflare-scheduler-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Test Cloudflare dispatcher
        run: npm --prefix cloudflare/portfolio-scheduler test

  import-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: .github/requirements-portfolio-pipeline.txt

      - name: Install portfolio pipeline dependencies only
        run: python -m pip install -r .github/requirements-portfolio-pipeline.txt

      - name: Verify dependency closure and script startup
        run: |
          python -m pip check
          python scripts/portfolio_market_data.py --help
          python scripts/portfolio_premarket_readiness.py --help
          python scripts/portfolio_close_readiness.py --help
          python scripts/portfolio_close_watchdog.py --help
          python scripts/portfolio_snapshot_repair.py --help
          python -c "import scripts.portfolio_intraday_history; import scripts.portfolio_midday_reconstruction; import scripts.portfolio_snapshot_store"
          python scripts/validate_portfolio_snapshot.py --help
