name: Portfolio Market Data

on:
  schedule:
    # UTC -> Asia/Shanghai: 06:37, 07:07, 07:37 Monday-Friday.
    - cron: '37 22 * * 0-4'
    - cron: '07 23 * * 0-4'
    - cron: '37 23 * * 0-4'
    # UTC -> Asia/Shanghai: 11:35, 11:50, 12:10 Monday-Friday.
    - cron: '35 3 * * 1-5'
    - cron: '50 3 * * 1-5'
    - cron: '10 4 * * 1-5'
    # UTC -> Asia/Shanghai: 14:23, 15:43, 16:43, 17:03 Monday-Friday.
    - cron: '23 6 * * 1-5'
    - cron: '43 7 * * 1-5'
    - cron: '43 8 * * 1-5'
    - cron: '3 9 * * 1-5'
  workflow_dispatch:
    inputs:
      phase:
        description: Snapshot phase to generate
        required: true
        default: intraday
        type: choice
        options:
          - premarket
          - midday
          - close
          - intraday
      trigger_source:
        description: Scheduler source for diagnostics
        required: false
        default: workflow_dispatch
        type: string
      expected_slot:
        description: Expected Asia/Shanghai business slot (HH:MM)
        required: false
        type: string

permissions:
  contents: write

jobs:
  resolve_phase:
    runs-on: ubuntu-latest
    outputs:
      phase: ${{ steps.phase.outputs.phase }}
    steps:
      - name: Checkout schedule map
        uses: actions/checkout@v5
        with:
          sparse-checkout: scripts/portfolio_schedule_map.py
          sparse-checkout-cone-mode: false

      - name: Resolve phase
        id: phase
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_PHASE: ${{ inputs.phase }}
          SCHEDULE_CRON: ${{ github.event.schedule }}
        run: |
          args=()
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            args+=(--manual-phase "$MANUAL_PHASE")
          else
            args+=(--schedule "$SCHEDULE_CRON")
          fi
          python scripts/portfolio_schedule_map.py "${args[@]}"

  generate:
    needs: resolve_phase
    runs-on: ubuntu-latest
    timeout-minutes: 180
    concurrency:
      # Snapshot manifests, latest pointers and health are shared derived state.
      group: portfolio-snapshot-writer-${{ github.ref }}
      cancel-in-progress: false
    env:
      PHASE: ${{ needs.resolve_phase.outputs.phase }}
      EVENT_NAME: ${{ github.event_name }}
      SCHEDULE_CRON: ${{ github.event.schedule }}
      TRIGGER_SOURCE: ${{ github.event_name == 'schedule' && 'github_schedule' || inputs.trigger_source || 'workflow_dispatch' }}
      DISPATCH_EXPECTED_SLOT: ${{ inputs.expected_slot }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: .github/requirements-portfolio-pipeline.txt

      - name: Install token-free market data dependencies
        run: pip install -r .github/requirements-portfolio-pipeline.txt

      - name: Refresh branch before readiness
        run: git pull --ff-only origin "$GITHUB_REF_NAME"

      - name: Resolve schedule and business-date context
        id: context
        run: |
          args=(--phase "$PHASE" --event-name "$EVENT_NAME")
          if [ -n "$SCHEDULE_CRON" ]; then
            args+=(--schedule "$SCHEDULE_CRON")
          fi
          python scripts/portfolio_schedule_context.py "${args[@]}"

      - name: Check snapshot readiness
        id: readiness
        if: env.PHASE != 'intraday'
        env:
          TARGET_DATE: ${{ steps.context.outputs.target_date }}
          EXPECTED_DATA_DATE: ${{ steps.context.outputs.expected_data_date }}
          GENERATION_MODE: ${{ steps.context.outputs.generation_mode }}
        run: |
          python scripts/portfolio_snapshot_readiness.py \
            --phase "$PHASE" \
            --target-date "$TARGET_DATE" \
            --expected-data-date "$EXPECTED_DATA_DATE" \
            --generation-mode "$GENERATION_MODE"

      - name: Decide whether generation is required
        id: decision
        env:
          FORMAL_SHOULD_GENERATE: ${{ steps.readiness.outputs.should_generate }}
        run: |
          if [ "$PHASE" = "intraday" ]; then
            should_generate=true
          else
            should_generate="$FORMAL_SHOULD_GENERATE"
          fi
          if [ "$should_generate" != "true" ] && [ "$should_generate" != "false" ]; then
            echo "Invalid generation decision for $PHASE: $should_generate" >&2
            exit 1
          fi
          echo "should_generate=$should_generate" >> "$GITHUB_OUTPUT"

      - name: Wait for phase recovery window
        id: gate
        if: >-
          env.PHASE != 'intraday' &&
          steps.decision.outputs.should_generate == 'true'
        env:
          TARGET_DATE: ${{ steps.context.outputs.target_date }}
          EXPECTED_DATA_DATE: ${{ steps.context.outputs.expected_data_date }}
          GENERATION_MODE: ${{ steps.context.outputs.generation_mode }}
          EXPECTED_SLOT: ${{ steps.context.outputs.expected_slot }}
          LATENESS_MINUTES: ${{ steps.context.outputs.lateness_minutes }}
          CUTOFF: ${{ steps.context.outputs.cutoff }}
        run: |
          set +e
          gate_output="$(python scripts/portfolio_phase_gate.py \
            --phase "$PHASE" \
            --target-date "$TARGET_DATE" \
            --expected-data-date "$EXPECTED_DATA_DATE" \
            --generation-mode "$GENERATION_MODE")"
          gate_rc=$?
          set -e
          printf '%s\n' "$gate_output"
          if [ "$gate_rc" -ne 0 ]; then
            gate_state="$(printf '%s\n' "$gate_output" | tail -n 1)"
            echo "phase=$PHASE"
            echo "expected_slot=$EXPECTED_SLOT"
            echo "actual_start=$(TZ=Asia/Shanghai date --iso-8601=seconds)"
            echo "lateness=${LATENESS_MINUTES}m"
            echo "cutoff=${CUTOFF:-none}"
            echo "result=${gate_state:-PHASE_GATE_FAILED}"
            exit 1
          fi

      - name: Recheck readiness before generator
        id: before_generator
        if: >-
          env.PHASE != 'intraday' &&
          steps.decision.outputs.should_generate == 'true'
        env:
          TARGET_DATE: ${{ steps.context.outputs.target_date }}
          EXPECTED_DATA_DATE: ${{ steps.context.outputs.expected_data_date }}
          GENERATION_MODE: ${{ steps.context.outputs.generation_mode }}
        run: |
          python scripts/portfolio_snapshot_readiness.py \
            --phase "$PHASE" \
            --target-date "$TARGET_DATE" \
            --expected-data-date "$EXPECTED_DATA_DATE" \
            --generation-mode "$GENERATION_MODE"

      - name: Generate portfolio JSON
        id: generator
        if: >-
          steps.decision.outputs.should_generate == 'true' &&
          (env.PHASE == 'intraday' || steps.before_generator.outputs.should_generate == 'true')
        env:
          TARGET_DATE: ${{ steps.context.outputs.target_date }}
          EXPECTED_DATA_DATE: ${{ steps.context.outputs.expected_data_date }}
          GENERATION_MODE: ${{ steps.context.outputs.generation_mode }}
        run: |
          echo "attempted=true" >> "$GITHUB_OUTPUT"
          if [ "$GENERATION_MODE" = "reconstructed" ]; then
            result_path="$(mktemp)"
            if ! python scripts/portfolio_snapshot_repair.py \
              --phase "$PHASE" \
              --target-date "$TARGET_DATE" \
              --result-path "$result_path"; then
              echo "GENERATION_FAILED"
              echo "result=failed" >> "$GITHUB_OUTPUT"
              exit 1
            fi
            result="$(cat "$result_path")"
            rm -f "$result_path"
            printf '%s\n' "$result"
            state="$(printf '%s' "$result" | jq -r '.[-1].state // empty')"
            echo "state=$state" >> "$GITHUB_OUTPUT"
            echo "result=run" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          args=(--phase "$PHASE")
          if [ "$PHASE" != "intraday" ]; then
            args+=(--target-date "$TARGET_DATE")
            args+=(--expected-data-date "$EXPECTED_DATA_DATE")
          fi
          if [ "$PHASE" != "intraday" ]; then
            args+=(--generation-mode "$GENERATION_MODE")
          fi
          if ! python scripts/portfolio_market_data.py "${args[@]}"; then
            echo "GENERATION_FAILED"
            echo "result=failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "result=run" >> "$GITHUB_OUTPUT"

      - name: Validate generated snapshot contract
        id: contract
        if: steps.generator.outputs.attempted == 'true'
        env:
          TARGET_DATE: ${{ steps.context.outputs.target_date }}
          EXPECTED_DATA_DATE: ${{ steps.context.outputs.expected_data_date }}
          GENERATION_MODE: ${{ steps.context.outputs.generation_mode }}
        run: |
          snapshot="data/portfolio/${PHASE}.json"
          canonical="data/portfolio/snapshots/${TARGET_DATE}/${PHASE}.json"
          if [ -z "$(git status --porcelain -- data/portfolio)" ]; then
            echo "git_diff=unchanged" >> "$GITHUB_OUTPUT"
            if [ "$PHASE" != "intraday" ]; then
              readiness="$(python scripts/portfolio_snapshot_readiness.py \
                --phase "$PHASE" \
                --target-date "$TARGET_DATE" \
                --expected-data-date "$EXPECTED_DATA_DATE" \
                --generation-mode "$GENERATION_MODE")"
              if [ "$(printf '%s' "$readiness" | jq -r '.fresh')" = "true" ]; then
                echo "generated=false" >> "$GITHUB_OUTPUT"
                echo "validator=pass" >> "$GITHUB_OUTPUT"
                echo "SNAPSHOT_ALREADY_FRESH"
                exit 0
              fi
            fi
            echo "generated=false" >> "$GITHUB_OUTPUT"
            echo "validator=fail" >> "$GITHUB_OUTPUT"
            echo "SNAPSHOT_NOT_UPDATED"
            exit 1
          fi
          echo "git_diff=changed" >> "$GITHUB_OUTPUT"
          if [ "$PHASE" != "intraday" ] && [ -f "$canonical" ]; then
            validation_path="$canonical"
          else
            validation_path="$snapshot"
          fi
          if [ "$GENERATION_MODE" = "reconstructed" ] && [ ! -f "$canonical" ]; then
            manifest="data/portfolio/snapshots/${TARGET_DATE}/manifest.json"
            lifecycle="$(jq -r ".phases.${PHASE}.lifecycle_status // empty" "$manifest" 2>/dev/null || true)"
            if [ "$lifecycle" = "missed" ] || [ "$lifecycle" = "error" ]; then
              echo "generated=true" >> "$GITHUB_OUTPUT"
              echo "validator=degraded" >> "$GITHUB_OUTPUT"
              echo "SNAPSHOT_MISSED"
              exit 0
            fi
            echo "validator=fail" >> "$GITHUB_OUTPUT"
            echo "SNAPSHOT_NOT_UPDATED"
            exit 1
          fi
          args=(--phase "$PHASE" --path "$validation_path")
          if [ "$PHASE" != "intraday" ]; then
            args+=(--target-date "$TARGET_DATE")
            args+=(--expected-data-date "$EXPECTED_DATA_DATE")
            args+=(--generation-mode "$GENERATION_MODE")
          fi
          if ! python scripts/validate_portfolio_snapshot.py "${args[@]}"; then
            echo "SNAPSHOT_CONTRACT_FAILED"
            echo "validator=fail" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "generated=true" >> "$GITHUB_OUTPUT"
          echo "validator=pass" >> "$GITHUB_OUTPUT"

      - name: Commit updated snapshot safely
        id: commit
        if: steps.contract.outputs.generated == 'true'
        env:
          TARGET_DATE: ${{ steps.context.outputs.target_date }}
          EXPECTED_DATA_DATE: ${{ steps.context.outputs.expected_data_date }}
          GENERATION_MODE: ${{ steps.context.outputs.generation_mode }}
        run: |
          snapshot="data/portfolio/${PHASE}.json"
          remote_is_fresh() {
            if [ "$PHASE" = "intraday" ]; then
              return 1
            fi
            git fetch origin "$GITHUB_REF_NAME"
            remote_snapshot="$(mktemp)"
            canonical="data/portfolio/snapshots/${TARGET_DATE}/${PHASE}.json"
            if git cat-file -e "origin/${GITHUB_REF_NAME}:${canonical}" 2>/dev/null; then
              remote_path="$canonical"
            else
              remote_path="$snapshot"
            fi
            if ! git show "origin/${GITHUB_REF_NAME}:${remote_path}" > "$remote_snapshot" 2>/dev/null; then
              rm -f "$remote_snapshot"
              return 1
            fi
            readiness="$(python scripts/portfolio_snapshot_readiness.py \
              --phase "$PHASE" \
              --path "$remote_snapshot" \
              --target-date "$TARGET_DATE" \
              --expected-data-date "$EXPECTED_DATA_DATE" \
              --generation-mode "$GENERATION_MODE")"
            rm -f "$remote_snapshot"
            [ "$(printf '%s' "$readiness" | jq -r '.fresh')" = "true" ]
          }

          if remote_is_fresh; then
            echo "REMOTE_SNAPSHOT_ALREADY_FRESH"
            echo "result=no-op" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git add -- data/portfolio
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git commit -m "chore: update portfolio ${PHASE} snapshot state"; then
            echo "PUSH_FAILED"
            echo "result=failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          for attempt in 1 2 3; do
            if ! git pull --rebase origin "$GITHUB_REF_NAME"; then
              echo "PUSH_FAILED: rebase attempt $attempt"
              echo "result=failed" >> "$GITHUB_OUTPUT"
              exit 1
            fi
            if remote_is_fresh; then
              echo "REMOTE_SNAPSHOT_ALREADY_FRESH"
              echo "result=no-op" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if git push origin "HEAD:$GITHUB_REF_NAME"; then
              echo "result=committed" >> "$GITHUB_OUTPUT"
              echo "SNAPSHOT_GENERATED"
              exit 0
            fi
            echo "push attempt $attempt failed; refreshing remote before retry"
          done
          echo "PUSH_FAILED"
          echo "result=failed" >> "$GITHUB_OUTPUT"
          exit 1

      - name: Verify final remote freshness
        id: final
        if: >-
          success() &&
          env.PHASE != 'intraday' &&
          steps.readiness.outputs.reason != 'non_trading_day'
        env:
          TARGET_DATE: ${{ steps.context.outputs.target_date }}
          EXPECTED_DATA_DATE: ${{ steps.context.outputs.expected_data_date }}
          GENERATION_MODE: ${{ steps.context.outputs.generation_mode }}
        run: |
          git fetch origin "$GITHUB_REF_NAME"
          remote_snapshot="$(mktemp)"
          canonical="data/portfolio/snapshots/${TARGET_DATE}/${PHASE}.json"
          compatibility="data/portfolio/${PHASE}.json"
          if git cat-file -e "origin/${GITHUB_REF_NAME}:${canonical}" 2>/dev/null; then
            remote_path="$canonical"
          else
            remote_path="$compatibility"
          fi
          if ! git show "origin/${GITHUB_REF_NAME}:${remote_path}" > "$remote_snapshot" 2>/dev/null; then
            echo "FINAL_SNAPSHOT_NOT_FRESH"
            exit 1
          fi
          readiness="$(python scripts/portfolio_snapshot_readiness.py \
            --phase "$PHASE" \
            --path "$remote_snapshot" \
            --target-date "$TARGET_DATE" \
            --expected-data-date "$EXPECTED_DATA_DATE" \
            --generation-mode "$GENERATION_MODE")"
          rm -f "$remote_snapshot"
          printf '%s\n' "$readiness"
          if [ "$(printf '%s' "$readiness" | jq -r '.fresh')" != "true" ]; then
            if [ "$GENERATION_MODE" = "reconstructed" ]; then
              remote_manifest="$(mktemp)"
              if git show "origin/${GITHUB_REF_NAME}:data/portfolio/snapshots/${TARGET_DATE}/manifest.json" > "$remote_manifest" 2>/dev/null; then
                lifecycle="$(jq -r ".phases.${PHASE}.lifecycle_status // empty" "$remote_manifest")"
                rm -f "$remote_manifest"
                if [ "$lifecycle" = "missed" ] || [ "$lifecycle" = "error" ]; then
                  echo "fresh=false" >> "$GITHUB_OUTPUT"
                  echo "degraded=true" >> "$GITHUB_OUTPUT"
                  echo "SNAPSHOT_MISSED"
                  exit 0
                fi
              fi
            fi
            echo "FINAL_SNAPSHOT_NOT_FRESH"
            exit 1
          fi
          echo "fresh=true" >> "$GITHUB_OUTPUT"
          echo "generated_at=$(printf '%s' "$readiness" | jq -r '.generated_at // ""')" >> "$GITHUB_OUTPUT"
          echo "snapshot_as_of=$(printf '%s' "$readiness" | jq -r '.snapshot_as_of // ""')" >> "$GITHUB_OUTPUT"
          echo "information_cutoff=$(printf '%s' "$readiness" | jq -r '.information_cutoff // ""')" >> "$GITHUB_OUTPUT"
          echo "data_date=$(printf '%s' "$readiness" | jq -r '.data_date // ""')" >> "$GITHUB_OUTPUT"
          echo "blocking=$(printf '%s' "$readiness" | jq -r '.blocking // ""')" >> "$GITHUB_OUTPUT"

      - name: Write workflow summary
        if: always()
        env:
          CONTEXT_EXPECTED_SLOT: ${{ steps.context.outputs.expected_slot }}
          TARGET_DATE: ${{ steps.context.outputs.target_date }}
          EXPECTED_DATA_DATE: ${{ steps.context.outputs.expected_data_date }}
          CUTOFF: ${{ steps.context.outputs.cutoff }}
          CONTEXT_TIME: ${{ steps.context.outputs.current_beijing_time }}
          LATENESS_MINUTES: ${{ steps.context.outputs.lateness_minutes }}
          GENERATION_MODE: ${{ steps.context.outputs.generation_mode }}
          CONTEXT_REASON: ${{ steps.context.outputs.reason }}
          RECOVERY_WINDOW_START: ${{ steps.context.outputs.recovery_window_start }}
          RECOVERY_WINDOW_END: ${{ steps.context.outputs.recovery_window_end }}
          INSIDE_RECOVERY_WINDOW: ${{ steps.context.outputs.inside_recovery_window }}
          SHOULD_GENERATE: ${{ steps.decision.outputs.should_generate }}
          CURRENT_GENERATED_AT: ${{ steps.readiness.outputs.generated_at }}
          CURRENT_SNAPSHOT_AS_OF: ${{ steps.readiness.outputs.snapshot_as_of }}
          CURRENT_INFORMATION_CUTOFF: ${{ steps.readiness.outputs.information_cutoff }}
          CURRENT_DATA_DATE: ${{ steps.readiness.outputs.data_date }}
          CURRENT_MARKET_PHASE: ${{ steps.readiness.outputs.market_phase }}
          CURRENT_PORTFOLIO_STATUS: ${{ steps.readiness.outputs.portfolio_status }}
          CURRENT_BLOCKING: ${{ steps.readiness.outputs.blocking }}
          READINESS_FRESHNESS: ${{ steps.readiness.outputs.freshness }}
          READINESS_REASON: ${{ steps.readiness.outputs.reason }}
          READINESS_STATE_CODE: ${{ steps.readiness.outputs.state_code }}
          GENERATOR_RESULT: ${{ steps.generator.outputs.result }}
          VALIDATOR_RESULT: ${{ steps.contract.outputs.validator }}
          GIT_DIFF_RESULT: ${{ steps.contract.outputs.git_diff }}
          COMMIT_RESULT: ${{ steps.commit.outputs.result }}
          GATE_STATUS: ${{ steps.gate.outputs.status }}
          FINAL_FRESH: ${{ steps.final.outputs.fresh }}
          FINAL_DEGRADED: ${{ steps.final.outputs.degraded }}
          FINAL_GENERATED_AT: ${{ steps.final.outputs.generated_at }}
          FINAL_SNAPSHOT_AS_OF: ${{ steps.final.outputs.snapshot_as_of }}
          FINAL_INFORMATION_CUTOFF: ${{ steps.final.outputs.information_cutoff }}
          FINAL_DATA_DATE: ${{ steps.final.outputs.data_date }}
          FINAL_BLOCKING: ${{ steps.final.outputs.blocking }}
        run: |
          expected_slot="${DISPATCH_EXPECTED_SLOT:-$CONTEXT_EXPECTED_SLOT}"
          summary_snapshot="data/portfolio/snapshots/${TARGET_DATE}/${PHASE}.json"
          if [ ! -f "$summary_snapshot" ]; then
            summary_snapshot="data/portfolio/${PHASE}.json"
          fi
          snapshot_as_of="$(jq -r '.snapshot_as_of // empty' "$summary_snapshot" 2>/dev/null || true)"
          snapshot_status="$(jq -r '.status // empty' "$summary_snapshot" 2>/dev/null || true)"
          snapshot_completeness="$(jq -r '.completeness // empty' "$summary_snapshot" 2>/dev/null || true)"
          snapshot_warnings="$(jq -r '.data_quality.warnings_count // empty' "$summary_snapshot" 2>/dev/null || true)"
          provider="$(jq -r '.provenance.provider // empty' "$summary_snapshot" 2>/dev/null || true)"
          pipeline_health="$(jq -r '.status // empty' data/portfolio/pipeline_health.json 2>/dev/null || true)"
          if [ "$FINAL_DEGRADED" = "true" ]; then
            final_state="SNAPSHOT_MISSED"
          elif [ "$FINAL_FRESH" = "true" ] && [ "$COMMIT_RESULT" = "committed" ]; then
            final_state="SNAPSHOT_GENERATED"
          elif [ "$COMMIT_RESULT" = "no-op" ]; then
            final_state="REMOTE_SNAPSHOT_ALREADY_FRESH"
          elif [ "$FINAL_FRESH" = "true" ]; then
            final_state="SNAPSHOT_ALREADY_FRESH"
          elif [ "$CONTEXT_REASON" = "NON_TRADING_DAY" ]; then
            final_state="NON_TRADING_DAY"
          elif [ "$GATE_STATUS" = "RECOVERY_WINDOW_EXPIRED" ]; then
            final_state="RECOVERY_WINDOW_EXPIRED"
          elif [ "$GENERATOR_RESULT" = "failed" ]; then
            final_state="GENERATION_FAILED"
          elif [ "$VALIDATOR_RESULT" = "fail" ]; then
            final_state="SNAPSHOT_CONTRACT_FAILED"
          else
            final_state="FINAL_SNAPSHOT_NOT_FRESH"
          fi

          {
            echo "## Portfolio Market Data"
            echo
            echo "Event: ${EVENT_NAME}"
            echo "Trigger source: ${TRIGGER_SOURCE}"
            echo "Schedule expression: ${SCHEDULE_CRON:-manual}"
            echo "Resolved phase: ${PHASE}"
            echo
            echo "Expected:"
            echo "- expected schedule slot: ${expected_slot:-unavailable}"
            echo "- expected trading date: ${TARGET_DATE:-unavailable}"
            echo "- expected data_date: ${EXPECTED_DATA_DATE:-unavailable}"
            echo "- cutoff: ${CUTOFF:-none}"
            echo
            echo "Actual:"
            echo "- workflow run id: ${GITHUB_RUN_ID}"
            echo "- job start Beijing time: ${CONTEXT_TIME:-unavailable}"
            echo "- current Beijing time: $(TZ=Asia/Shanghai date --iso-8601=seconds)"
            echo "- lateness_minutes: ${LATENESS_MINUTES:-unavailable}"
            echo
            echo "Current snapshot:"
            echo "- generated_at: ${CURRENT_GENERATED_AT:-unavailable}"
            echo "- snapshot_as_of: ${CURRENT_SNAPSHOT_AS_OF:-unavailable}"
            echo "- information_cutoff: ${CURRENT_INFORMATION_CUTOFF:-unavailable}"
            echo "- data_date: ${CURRENT_DATA_DATE:-unavailable}"
            echo "- market_phase: ${CURRENT_MARKET_PHASE:-unavailable}"
            echo "- portfolio_status: ${CURRENT_PORTFOLIO_STATUS:-unavailable}"
            echo "- blocking: ${CURRENT_BLOCKING:-unavailable}"
            echo
            echo "Readiness:"
            echo "- ${READINESS_FRESHNESS:-not-checked}"
            echo "- reason: ${READINESS_REASON:-not-checked}"
            echo "- schedule decision: ${CONTEXT_REASON:-unavailable}"
            echo "- state code: ${READINESS_STATE_CODE:-not-checked}"
            echo
            echo "Recovery window:"
            echo "- start: ${RECOVERY_WINDOW_START:-unavailable}"
            echo "- end: ${RECOVERY_WINDOW_END:-open-ended}"
            echo "- inside recovery window: ${INSIDE_RECOVERY_WINDOW:-false}"
            echo "- should_generate: ${SHOULD_GENERATE:-false}"
            echo
            echo "Execution:"
            echo "- phase gate: ${GATE_STATUS:-skipped}"
            echo "- generator: ${GENERATOR_RESULT:-skipped}"
            echo "- generation mode: ${GENERATION_MODE:-live}"
            echo "- provider selected: ${provider:-per-security fallback chain}"
            echo "- validator: ${VALIDATOR_RESULT:-skipped}"
            echo "- git diff: ${GIT_DIFF_RESULT:-unchanged}"
            echo "- commit: ${COMMIT_RESULT:-no-op}"
            echo
            echo "Final:"
            echo "- snapshot fresh: ${FINAL_FRESH:-false}"
            echo "- snapshot_as_of: ${snapshot_as_of:-unavailable}"
            echo "- information_cutoff: ${FINAL_INFORMATION_CUTOFF:-unavailable}"
            echo "- snapshot status: ${snapshot_status:-unavailable}"
            echo "- completeness: ${snapshot_completeness:-unavailable}"
            echo "- blocking: ${FINAL_BLOCKING:-unavailable}"
            echo "- warnings_count: ${snapshot_warnings:-unavailable}"
            echo "- pipeline health: ${pipeline_health:-unavailable}"
            echo "- final generated_at: ${FINAL_GENERATED_AT:-unavailable}"
            echo "- final data_date: ${FINAL_DATA_DATE:-unavailable}"
            echo "- final state code: ${final_state}"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "$final_state"
