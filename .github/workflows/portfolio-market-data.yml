name: Portfolio Market Data

on:
  schedule:
    # GitHub cron is UTC. These map to 08:48, 11:35 and 15:10 Asia/Shanghai.
    - cron: '48 0 * * 1-5'
    - cron: '35 3 * * 1-5'
    - cron: '10 7 * * 1-5'
  workflow_dispatch:
    inputs:
      phase:
        description: Snapshot phase to generate
        required: true
        default: all
        type: choice
        options:
          - premarket
          - midday
          - close
          - intraday
          - all
      force_non_trading_day:
        description: Allow generation on a non-trading day (diagnostics only)
        required: false
        default: false
        type: boolean

concurrency:
  group: portfolio-market-data-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: .github/requirements-portfolio-pipeline.txt

      - name: Install token-free market data dependencies
        run: pip install -r .github/requirements-portfolio-pipeline.txt

      - name: Resolve phase
        id: phase
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_PHASE: ${{ inputs.phase }}
          SCHEDULE_CRON: ${{ github.event.schedule }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            phase="$MANUAL_PHASE"
          elif [ "$SCHEDULE_CRON" = "48 0 * * 1-5" ]; then
            phase="premarket"
          elif [ "$SCHEDULE_CRON" = "35 3 * * 1-5" ]; then
            phase="midday"
          elif [ "$SCHEDULE_CRON" = "10 7 * * 1-5" ]; then
            phase="close"
          else
            echo "Unknown trigger: $SCHEDULE_CRON" >&2
            exit 1
          fi
          echo "phase=$phase" >> "$GITHUB_OUTPUT"

      - name: Generate portfolio JSON
        env:
          FORCE_NON_TRADING_DAY: ${{ inputs.force_non_trading_day }}
        run: |
          force_arg=""
          if [ "$FORCE_NON_TRADING_DAY" = "true" ]; then
            force_arg="--force"
          fi
          python scripts/portfolio_market_data.py --phase "${{ steps.phase.outputs.phase }}" $force_arg

      - name: Commit updated snapshots
        run: |
          git add -- data/portfolio/*.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No portfolio snapshot changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update portfolio market data"
          git push
