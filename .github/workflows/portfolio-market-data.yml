name: Portfolio Market Data

on:
  schedule:
    # GitHub cron is UTC. Premarket 22:37 Sun-Thu maps to 06:37 Mon-Fri in Shanghai.
    - cron: '37 22 * * 0-4'
    # Midday/close enter the queue early; the phase gate waits for 11:32/15:05 Shanghai.
    - cron: '53 2 * * 1-5'
    - cron: '23 6 * * 1-5'
  workflow_dispatch:
    inputs:
      phase:
        description: Snapshot phase to generate
        required: true
        default: intraday
        type: choice
        options:
          - premarket
          - midday
          - close
          - intraday

concurrency:
  group: portfolio-market-data-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: .github/requirements-portfolio-pipeline.txt

      - name: Resolve phase
        id: phase
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_PHASE: ${{ inputs.phase }}
          SCHEDULE_CRON: ${{ github.event.schedule }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            phase="$MANUAL_PHASE"
          elif [ "$SCHEDULE_CRON" = "37 22 * * 0-4" ]; then
            phase="premarket"
          elif [ "$SCHEDULE_CRON" = "53 2 * * 1-5" ]; then
            phase="midday"
          elif [ "$SCHEDULE_CRON" = "23 6 * * 1-5" ]; then
            phase="close"
          else
            echo "Unknown trigger: $SCHEDULE_CRON" >&2
            exit 1
          fi
          echo "phase=$phase" >> "$GITHUB_OUTPUT"

      - name: Install token-free market data dependencies
        run: pip install -r .github/requirements-portfolio-pipeline.txt

      - name: Wait for scheduled market target
        if: github.event_name == 'schedule'
        run: python scripts/portfolio_phase_gate.py --phase "${{ steps.phase.outputs.phase }}"

      - name: Generate portfolio JSON
        run: python scripts/portfolio_market_data.py --phase "${{ steps.phase.outputs.phase }}"

      - name: Validate generated snapshot contract
        id: contract
        env:
          PHASE: ${{ steps.phase.outputs.phase }}
        run: |
          snapshot="data/portfolio/${PHASE}.json"
          if [ -z "$(git status --porcelain -- "$snapshot")" ]; then
            echo "current snapshot unavailable: no new $snapshot was generated"
            echo "generated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python scripts/validate_portfolio_snapshot.py --phase "$PHASE" --path "$snapshot"
          echo "generated=true" >> "$GITHUB_OUTPUT"

      - name: Commit updated snapshots
        if: steps.contract.outputs.generated == 'true'
        env:
          PHASE: ${{ steps.phase.outputs.phase }}
        run: |
          git add -- "data/portfolio/${PHASE}.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update portfolio ${PHASE} data"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
