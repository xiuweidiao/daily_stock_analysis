name: Portfolio Snapshot Repair

on:
  schedule:
    # UTC -> Asia/Shanghai: 18:37 and 22:17 Monday-Friday.
    - cron: '37 10 * * 1-5'
    - cron: '17 14 * * 1-5'
    # UTC -> Asia/Shanghai: 06:07 every day, including Saturday repair for Friday.
    - cron: '07 22 * * *'
  workflow_dispatch:
    inputs:
      days:
        description: Recent A-share trading days to audit
        required: true
        default: '5'

permissions:
  contents: write

concurrency:
  group: portfolio-snapshot-writer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: .github/requirements-portfolio-pipeline.txt

      - name: Install token-free market data dependencies
        run: pip install -r .github/requirements-portfolio-pipeline.txt

      - name: Refresh branch
        run: git pull --ff-only origin "$GITHUB_REF_NAME"

      - name: Audit and repair recent trading days
        id: repair
        env:
          DAYS: ${{ inputs.days || '5' }}
        run: |
          result_path="$(mktemp)"
          python scripts/portfolio_snapshot_repair.py --days "$DAYS" --result-path "$result_path"
          result="$(cat "$result_path")"
          rm -f "$result_path"
          printf '%s\n' "$result"
          echo "result<<EOF" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$result" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          health="$(jq -r '.status // "degraded"' data/portfolio/pipeline_health.json 2>/dev/null || echo degraded)"
          echo "health=$health" >> "$GITHUB_OUTPUT"

      - name: Commit repaired snapshot state
        id: commit
        run: |
          if [ -z "$(git status --porcelain -- data/portfolio)" ]; then
            echo "result=no-op" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git add -- data/portfolio
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: repair portfolio snapshot store"
          for attempt in 1 2 3; do
            if ! git pull --rebase origin "$GITHUB_REF_NAME"; then
              echo "result=failed" >> "$GITHUB_OUTPUT"
              exit 1
            fi
            if git push origin "HEAD:$GITHUB_REF_NAME"; then
              echo "result=committed" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "push attempt $attempt failed"
          done
          echo "result=failed" >> "$GITHUB_OUTPUT"
          exit 1

      - name: Verify remote state commit
        id: final
        run: |
          git fetch origin "$GITHUB_REF_NAME"
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/$GITHUB_REF_NAME)" ]; then
            echo "FINAL_REMOTE_VERIFICATION_FAILED"
            exit 1
          fi
          echo "verified=true" >> "$GITHUB_OUTPUT"

      - name: Write workflow summary
        if: always()
        env:
          HEALTH: ${{ steps.repair.outputs.health }}
          RESULT: ${{ steps.repair.outputs.result }}
          COMMIT_RESULT: ${{ steps.commit.outputs.result }}
          VERIFIED: ${{ steps.final.outputs.verified }}
        run: |
          {
            echo "## Portfolio Snapshot Repair"
            echo
            echo "Beijing time: $(TZ=Asia/Shanghai date --iso-8601=seconds)"
            echo "Event: ${GITHUB_EVENT_NAME}"
            echo "Schedule expression: ${{ github.event.schedule || 'manual' }}"
            echo "Audit window: last ${{ inputs.days || '5' }} A-share trading days"
            echo "Pipeline health: ${HEALTH:-failed}"
            echo "Commit: ${COMMIT_RESULT:-failed}"
            echo "Final remote verified: ${VERIFIED:-false}"
            echo
            echo '```json'
            printf '%s\n' "${RESULT:-[]}" | jq . 2>/dev/null || printf '%s\n' "${RESULT:-unavailable}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
